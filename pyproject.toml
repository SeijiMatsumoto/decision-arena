[project]
name = "decision-arena"
version = "0.1.0"
description = "Run decision models (Jev and friends) side by side on shared classification evals."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "httpx>=0.28.0",
  "pydantic>=2.11.0",
  "python-dotenv>=1.1.1",
  "pyyaml>=6.0.2",
  "rich>=14.1.0",
  "uvicorn>=0.32.0",
]

[project.scripts]
arena = "decision_arena.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.4.0",
  "ruff>=0.12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/decision_arena"]

[tool.ruff]
line-length = 100
