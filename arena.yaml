# Metadata for the arenas hub. Historical snapshots retain their original provenance.
name: decision-arena
title: Decision Arena
question: For bounded classification (pick a label, yes/no, a score), should a decision model like Jev
  make the call, or a cheap LLM?
repo: https://github.com/SeijiMatsumoto/decision-arena
data: 500 synthetic examples across 18 bounded decision categories; 200 previous examples plus 300 diverse expansion examples.
labels:
  source: mixed
  note: 119 original hand-written examples plus 381 assistant-authored synthetic examples and labels, not independently human-reviewed. The newest 300 are balanced across 10 new categories; exploratory and not a blind held-out test.
outcome:
  status: pending
  note: Not yet recorded which enable-ai decisions moved because of this result.
caveats:
- Synthetic labels have not been independently reviewed; production data is needed to establish generalization.
- Treat a 1-2 point accuracy gap as noise at this sample size.
- LLM reasoning is turned off where possible so latency comparisons are fair.
