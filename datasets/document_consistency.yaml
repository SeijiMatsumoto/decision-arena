name: document_consistency
description: Detect material disagreement between two records.
use_case: Detect material disagreement between two records.
question:
  type: choice
  instructions: Compare only the supplied records. Consistent means all overlapping material assertions agree
    after explicit unit conversions or rounding to the coarser stated precision. Conflict means incompatible
    material assertions about the same scope/time. Unresolved means identities, scope, units, or meaning cannot
    be aligned. Differences explicitly identified as historical versus current are not conflicts. A signed
    amendment supersedes earlier terms when explicitly stated.
  criteria:
    consistent: Material overlapping statements agree or an explicit amendment reconciles them.
    conflict: At least one material assertion is incompatible for the same scope/time.
    unresolved: Insufficient context to compare.
