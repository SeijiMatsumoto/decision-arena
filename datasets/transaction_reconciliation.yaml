name: transaction_reconciliation
description: Reconcile a payment against an invoice using explicit accounting rules.
use_case: Reconcile a payment against an invoice using explicit accounting rules.
question:
  type: choice
  instructions: Reconcile the stated target invoice. Match requires confirmed settled net payments equal to
    the invoice amount in the same currency, with explicit invoice linkage. Sum linked split payments; subtract
    confirmed refunds and chargebacks; subtract processor fees only when stated as withheld from a gross payment.
    Pending payments do not count. Mismatch means fully specified confirmed linked net amount differs from
    the invoice. Unresolved means missing currency, linkage, settlement, or conversion information prevents
    a conclusive result. Do not infer exchange rates or link on amount alone.
  criteria:
    match: Confirmed linked net payments equal invoice amount.
    mismatch: Confirmed linked net payments differ from invoice amount.
    unresolved: Necessary reconciliation evidence is missing.
