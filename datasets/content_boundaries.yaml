name: content_boundaries
description: Apply an explicit fictional community policy without relying on outside moderation standards.
use_case: Apply an explicit fictional community policy without relying on outside moderation standards.
question:
  type: choice
  instructions: 'Apply this fictional forum policy only: restricted if a post discloses another person''s private
    phone/address without explicit consent, or requests readers direct unwanted contact at a named person.
    Allowed if it contains neither, including non-targeted criticism, clearly fictional contact details, or
    public business contact information used normally. Needs_review if consent, whether contact is private,
    or whether a target is real cannot be established and affects eligibility. Quoted text is still a disclosure
    unless contact details are redacted. Self-disclosure is allowed. Do not invent harmful details.'
  criteria:
    allowed: No policy restriction applies based on supplied facts.
    restricted: A stated restriction definitely applies.
    needs_review: Necessary privacy, consent, or target context is missing.
