name: policy_eligibility
description: Apply a fictional returns policy including exceptions and missing facts.
use_case: Apply a fictional returns policy including exceptions and missing facts.
question:
  type: choice
  instructions: 'Policy: a return is eligible when requested within 30 calendar days of delivery (day 30 included),
    proof of purchase exists, and item is unused. A confirmed manufacturing defect overrides the unused condition
    and extends the window to 90 days inclusive. Final-sale items are never eligible except with a confirmed
    manufacturing defect. Use elapsed_days supplied, not today. If any known condition conclusively disqualifies,
    choose ineligible; otherwise missing necessary evidence means needs_review.'
  criteria:
    eligible: All requirements are established or the defect exception applies.
    ineligible: At least one known condition conclusively disqualifies.
    needs_review: No conclusive disqualifier, but necessary facts are missing.
