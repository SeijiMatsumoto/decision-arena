name: evidence_sufficiency
description: Assess whether supplied evidence establishes a claim.
use_case: Assess whether supplied evidence establishes a claim.
question:
  type: choice
  instructions: Use only supplied evidence. Supported means all material parts of the claim are established;
    contradicted means an explicit fact falsifies at least one material part. Otherwise choose insufficient.
    Absence of a fact is not its negation. If sources conflict without a stated precedence, choose insufficient.
  criteria:
    supported: Evidence establishes the complete claim.
    contradicted: Evidence explicitly falsifies a material part of the claim.
    insufficient: Evidence is missing, ambiguous, or unresolved.
examples:
- id: evidence_sufficiency-v3-01
  state:
    claim: Every order in batch B shipped.
    evidence: 'Batch B contains orders 11 and 12 only. Shipment log: 11 dispatched, 12 dispatched.'
  expected: supported
  tags:
  - synthetic-v3
  note: Assistant-authored synthetic evidence and label; checked against supplied rules, not independently
    human-reviewed.
