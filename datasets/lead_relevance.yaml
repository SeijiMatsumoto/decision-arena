name: lead_relevance
description: Does a candidate profile match a people-search query? Every constraint must hold today.
use_case: People finder - filter scraped profiles before showing them to the user
question:
  type: noul
  instructions: >
    Decide whether the person in `candidate` matches the `search`. Every constraint in the search
    (role, seniority, function, company type, location) must hold for the person's CURRENT position.
  criteria:
    "true": The candidate is a real person who currently satisfies every constraint in the search.
    "false": >
      At least one constraint fails: wrong role, seniority, function, company type or location; the
      matching role is in the past; or the candidate is not a person (e.g. a job posting).

examples:
  # --- Search A: engineering leaders at Berlin fintechs -------------------------------------
  - id: lr-a1
    group: berlin-fintech-eng
    state:
      search: VP or Head of Engineering at Series B+ fintech startups in Berlin
      candidate: Mara Lindqvist - VP Engineering at Paylane (Series C payments infrastructure, 400 employees). Berlin, Germany.
    expected: true
    tags: [clear]
  - id: lr-a2
    group: berlin-fintech-eng
    state:
      search: VP or Head of Engineering at Series B+ fintech startups in Berlin
      candidate: Tobias Reuter - Head of Engineering, Kontora (Series B SME banking app). Based in Berlin.
    expected: true
    tags: [clear]
  - id: lr-a3
    group: berlin-fintech-eng
    state:
      search: VP or Head of Engineering at Series B+ fintech startups in Berlin
      candidate: Jana Okafor - Former VP Engineering at Paylane (2019-2023). Now Partner at Northlake Ventures, Berlin.
    expected: false
    tags: [stale-data, distractor]
    note: Matching role is in the past.
  - id: lr-a4
    group: berlin-fintech-eng
    state:
      search: VP or Head of Engineering at Series B+ fintech startups in Berlin
      candidate: Felix Brandt - Engineering Manager at Kontora, Berlin. Reports to the Head of Engineering.
    expected: false
    tags: [edge]
    note: One level below the requested seniority.
  - id: lr-a5
    group: berlin-fintech-eng
    state:
      search: VP or Head of Engineering at Series B+ fintech startups in Berlin
      candidate: Priya Raman - VP Engineering at Coinvault (Series B crypto exchange). London, UK; previously lived in Berlin for six years.
    expected: false
    tags: [distractor]
    note: Berlin is mentioned but the current location is London.
  - id: lr-a6
    group: berlin-fintech-eng
    state:
      search: VP or Head of Engineering at Series B+ fintech startups in Berlin
      candidate: Lukas Meier - Head of Engineering at Gartenwerk (Series B direct-to-consumer garden furniture brand), Berlin.
    expected: false
    tags: [distractor]
    note: Right title, stage and city; wrong industry.
  - id: lr-a7
    group: berlin-fintech-eng
    state:
      search: VP or Head of Engineering at Series B+ fintech startups in Berlin
      candidate: Sofia Weber - Leiterin Softwareentwicklung bei Finvia, einem in der Serie B finanzierten Fintech-Startup mit Sitz in Berlin.
    expected: true
    tags: [multilingual]
  - id: lr-a8
    group: berlin-fintech-eng
    state:
      search: VP or Head of Engineering at Series B+ fintech startups in Berlin
      candidate: "Head of Engineering - Kontora - Berlin. We're hiring! Join our Series B team and lead 40 engineers. Apply now."
    expected: false
    tags: [adversarial]
    note: A job posting, not a person.

