name: workflow_completion
description: Determine if a fixed workflow has finished or requires action.
use_case: Determine if a fixed workflow has finished or requires action.
question:
  type: choice
  instructions: A workflow is complete only when every required step is confirmed successful. Blocked means
    a confirmed failed or rejected required step, or an explicitly unsatisfied prerequisite that prevents progress.
    Awaiting_input means no known blocker but necessary input, approval, or status is pending or unknown. Optional
    steps do not affect completion; skipped required steps need an explicit valid waiver. A confirmed later
    successful retry supersedes an earlier failure.
  criteria:
    complete: All required steps succeeded or were explicitly waived.
    blocked: A confirmed blocker prevents completion.
    awaiting_input: Necessary information or approval remains pending or unknown.
