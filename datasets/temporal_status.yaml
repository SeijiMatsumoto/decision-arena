name: temporal_status
description: Determine whether a permission or agreement is currently active.
use_case: Determine whether a permission or agreement is currently active.
question:
  type: choice
  instructions: Use the supplied as_of instant only. A start is inclusive and an end exclusive. Revocation
    is effective at its stated instant. A stated signed amendment supersedes prior dates. Classify active,
    inactive (not yet started, ended, or revoked), or unknown when required dates or precedence cannot be established.
    All time zones are explicit; do not infer an unspecified time zone.
  criteria:
    active: Valid at as_of.
    inactive: Definitely not valid at as_of.
    unknown: Validity cannot be established.
examples:
- id: temporal_status-v3-01
  state: as_of 2026-06-01T00:00Z; start 2026-06-01T00:00Z; end 2026-07-01T00:00Z.
  expected: active
  tags:
  - synthetic-v3
  note: Assistant-authored synthetic evidence and label; checked against supplied rules, not independently
    human-reviewed.
