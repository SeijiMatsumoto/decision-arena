name: change_impact
description: Classify compatibility of a proposed API change for a supplied consumer.
use_case: Classify compatibility of a proposed API change for a supplied consumer.
question:
  type: choice
  instructions: Judge the specified consumer under the stated compatibility contract, not general taste. Breaking
    means a previously valid required consumer operation will fail or materially change. Compatible means the
    supplied contract and consumer establish no such break. Insufficient means necessary behavior or consumer
    information is missing. Ignore cosmetic/internal changes when explicitly guaranteed not to affect the consumer.
  criteria:
    breaking: Known required consumer behavior breaks.
    compatible: Consumer remains compatible under explicit guarantees.
    insufficient: Cannot determine compatibility from supplied facts.
examples:
- id: change_impact-v3-01
  state: Consumer sends field name customer_id. New API removes customer_id with no alias; consumer is unchanged.
  expected: breaking
  tags:
  - synthetic-v3
  note: Assistant-authored synthetic evidence and label; checked against supplied rules, not independently
    human-reviewed.
- id: change_impact-v3-11
