name: constraint_selection
description: Choose the feasible option under explicit hard constraints.
use_case: Choose the feasible option under explicit hard constraints.
question:
  type: choice
  instructions: Choose A or B only if it satisfies every hard requirement. Ignore stated preferences unless
    both options qualify, then apply the supplied preference or tie-breaker. Choose none when neither qualifies.
    All necessary values are supplied; do not infer exceptions. Currency, time intervals, and units have their
    stated meaning. For scheduling, an available interval must contain the entire meeting.
  criteria:
    A: Option A is the selected feasible option.
    B: Option B is the selected feasible option.
    none: Neither option satisfies every hard requirement.
examples:
- id: constraint_selection-v3-01
  state: 'Requirements: budget <=100 USD, at least 8 GB RAM. A: USD 100, 8 GB. B: USD 90, 4 GB.'
  expected: A
  tags:
  - synthetic-v3
  note: Assistant-authored synthetic evidence and label; checked against supplied rules, not independently
    human-reviewed.
