name: commitment_detection
description: Distinguish an accountable commitment from suggestions or quoted language.
use_case: Distinguish an accountable commitment from suggestions or quoted language.
question:
  type: choice
  instructions: 'Classify the current speaker''s commitment to perform the stated target action. Firm means
    an explicit unconditional promise or acceptance by that speaker. Tentative means they propose it, hedge,
    or make it conditional on an unmet condition. None means no current speaker commitment: declined, negated,
    merely questioned, attributed to another person, or only quoted historical text. A later explicit correction
    within the message overrides earlier text. Use stated context to resolve conditions.'
  criteria:
    firm: Current speaker explicitly commits without an unmet condition.
    tentative: Current speaker proposes, hedges, or conditionally commits.
    none: No current speaker commitment to the target action.
